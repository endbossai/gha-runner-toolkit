# Publishes the runner image to GHCR on every `v*.*.*` tag push.
#
# Tag flow:
#   1. Land changes on main
#   2. `git tag v1.x.y && git push --tags`
#   3. This workflow fires, builds + pushes:
#        ghcr.io/endbossai/gha-runner-toolkit:v1.x.y
#        ghcr.io/endbossai/gha-runner-toolkit:v1.x       (rolling minor)
#        ghcr.io/endbossai/gha-runner-toolkit:v1         (rolling major)
#        ghcr.io/endbossai/gha-runner-toolkit:latest     (rolling, NOT for prod)
#
# Consumers should pin a specific `vMAJOR.MINOR.PATCH` tag in their
# docker-compose.yml. The rolling tags exist for easy upgrade paths
# inside a major; `latest` exists for tinkering only.

name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0). Required for manual runs."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gha-runner-toolkit
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
