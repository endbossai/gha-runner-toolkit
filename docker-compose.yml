# gha-runner-toolkit — single-service compose for the self-hosted
# GitHub Actions runner.
#
# Deployment:
#   cp .env.example .env  # fill in PAT, runner name, etc.
#   docker compose up -d
#
# Recycle (optional but recommended for long-running deploys):
#   See recycle.{sh,service,timer}. Daily 03:00 UTC `docker compose
#   down && build --pull && up -d` keeps state bounded and base-
#   image patches current.

services:
  # The runner agent. Pulled from GHCR (published from this repo's
  # tags). Pin a specific version in production; `latest` exists but
  # isn't recommended for environments you care about.
  #
  # If you want to build from source locally instead — e.g. for
  # iterating on the Dockerfile — comment out the `image:` line and
  # uncomment `build:`. Both shapes work; pick one.
  runner:
    image: ghcr.io/endbossai/gha-runner-toolkit:1.2.0
    # build:
    #   context: .
    # CONTAINER_NAME from .env (default `gha-runner`). Override when
    # running multiple instances on one host — each instance needs a
    # unique container_name. Must match recycle.sh's CONTAINER_NAME.
    container_name: ${CONTAINER_NAME:-gha-runner}
    restart: unless-stopped
    env_file:
      - .env
    # ────────────────────────────────────────────────────────────
    # Security hardening (v1.2). These four primitives together
    # collapse the blast radius of a compromised workflow step:
    #
    # `read_only: true` — the container's writable layer is sealed.
    #   The agent's mutable state (.runner, .credentials, _work,
    #   _diag) goes to the tmpfs mount at /runner, populated from
    #   the image-baked /opt/runner-dist by the entrypoint on each
    #   start. Anything a workflow writes outside the declared
    #   tmpfs mounts hits a read-only FS and fails immediately.
    #
    # `no-new-privileges: true` — prevents `execve` from granting
    #   any new privilege bits (setuid binaries can't elevate).
    #   With cap_drop: ALL there's not much to elevate to anyway,
    #   but this closes the gap if a setuid binary slips into the
    #   image via a future package update.
    #
    # `cap_drop: ALL` + `cap_add: [CHOWN, SETUID, SETGID,
    #   DAC_OVERRIDE]` — drop every Linux capability and add back
    #   the bare minimum the entrypoint and typical workflow steps
    #   need:
    #     - SETUID, SETGID — setpriv in entrypoint drops to runner
    #       user with the docker GID added as a supplementary group
    #     - CHOWN — entrypoint chowns /runner after populating it
    #       from /opt/runner-dist; also needed for tar -p extraction
    #       in workflows (actions/setup-java, etc.)
    #     - DAC_OVERRIDE — bypasses file mode checks during tar
    #       extraction when the archive uses unexpected ownership
    #
    # WHAT THIS DOES NOT FIX: the docker socket is still mounted
    # below. A workflow with effective socket access can spawn a
    # privileged sibling container and pwn the host. Acceptable on
    # private repos where committers are trusted; UNSAFE on public
    # repos without further mitigations (see README's "What you
    # trade off" section).
    # ────────────────────────────────────────────────────────────
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # Testcontainers Ryuk is its "watchdog" sidecar that cleans up
    # orphan test containers when the parent JVM dies. Ryuk runs on
    # the host docker daemon and tries to connect BACK to the test
    # process via a TCP port — which doesn't work when the test
    # process lives in our runner container (Ryuk's TCP probe can't
    # cross from host network into the runner's container network).
    # Disabling Ryuk is the standard fix for docker-out-of-docker
    # CI setups. Trade-off: a crashed test run can leave testcontainer
    # sidecars (Postgres, Kafka, etc.) running on the host. Mitigation:
    # recycle.sh's daily reclaim pass stops+removes those RUNNING
    # orphan sidecars (by their `org.testcontainers` label) and prunes
    # the stopped containers, orphan networks, dangling images, and
    # anonymous volumes they leave behind.
    #
    # TESTCONTAINERS_HOST_OVERRIDE is the other half of the docker-
    # out-of-docker dance. Testcontainers starts test containers on
    # the host daemon, and they bind to random high ports on the host.
    # From inside this runner container, `localhost:<port>` is the
    # runner itself, not the host — so the JVM under test can't reach
    # the test containers. The override tells Testcontainers to give
    # the JVM the host's address. `host.docker.internal` is Docker
    # Desktop's auto-resolving alias; on Linux VPS hosts where it
    # doesn't exist by default, the `extra_hosts` mapping below pins
    # it to the host-gateway IP.
    environment:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker socket mount lets the runner invoke `docker` against the
    # host's daemon — needed for docker-build workflows + Testcontainers.
    # SECURITY: anyone running code inside this container effectively
    # has root on the host via docker. Acceptable for private repos
    # where committers are trusted; UNSAFE for public repos where
    # anyone can submit a PR. See README "What you trade off".
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # tmpfs mounts back the writable paths the agent needs while
    # the rest of the FS stays read-only:
    #   /runner       — populated from /opt/runner-dist by entrypoint;
    #                   holds the agent binary, .runner/.credentials,
    #                   _work/ (workflow checkout), _diag/ (logs)
    #   /tmp          — general scratch; many workflows assume writable
    #   /home/runner  — npm/Gradle/Maven caches (lives for the day,
    #                   dies with the daily recycle)
    #
    # `exec` flag is important: build steps execute scripts copied
    # under these paths (Gradle wrappers, downloaded JDK binaries
    # via actions/setup-java, etc.). Default tmpfs is `noexec`.
    #
    # Sizes are upper bounds — tmpfs only consumes memory for actual
    # written bytes, not allocated capacity. The hard ceiling is the
    # container's `mem_limit` below, so the sum of these can exceed
    # that and OOM will trigger first.
    tmpfs:
      - /runner:size=8g,exec,mode=0755
      - /tmp:size=1g,exec,mode=1777
      - /home/runner:size=2g,exec,mode=0755
      # actions/setup-* tool cache. Populated by entrypoint from
      # /opt/hostedtoolcache-dist (image-baked Python 3.12 + 3.13
      # since v1.2). Needs to be writable so `pip install` against
      # the cached interpreter works; on the read-only main FS it
      # would EROFS. 1GB ceiling covers Python + a day of pip wheels;
      # bump if you also bake Node tools / Ruby / Go into the cache.
      - /opt/hostedtoolcache:size=1g,exec,mode=0755
    # Docker socket group access is set up by the entrypoint at start
    # time: it stat's /var/run/docker.sock for the host's docker GID
    # and uses setpriv to drop to the runner user with that GID added
    # as a supplementary group. Manual DOCKER_GID in .env remains
    # available as a fallback if socket detection ever fails.
    # Resource limits keep CI from eating the whole VPS if a workflow
    # goes wild. Tune to fit the VPS spec — current numbers assume a
    # 4-vCPU / 8GB box. Using top-level `mem_limit`/`cpus` because the
    # `deploy.resources.limits` shape is Swarm-mode and older compose
    # versions silently ignore it outside Swarm.
    mem_limit: 6g
    cpus: 3.5
    # Health: the agent process being alive is the meaningful signal.
    # `pgrep -x` is exact-match against /proc/<pid>/comm so a log line
    # or env var containing "Runner.Listener" can't false-positive.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x Runner.Listener > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
